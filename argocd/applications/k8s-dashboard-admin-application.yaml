apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-dashboard-admin-user
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yakovm44/argocd.git
    targetRevision: HEAD
    path: k8s-dashboard
  destination:
    server: https://kubernetes.default.svc
    namespace: kubernetes-dashboard
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=true
