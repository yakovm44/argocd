apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: thekeeper
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/yakovm44/argocd.git
    targetRevision: HEAD
    path: apps/thekeeper
  destination:
    server: https://kubernetes.default.svc
    namespace: thekeeper
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
