# PLACEHOLDER / DOCUMENTATION ONLY - this repo is public, do not put a real
# key here. The `Skip=true` sync option below tells ArgoCD to never create,
# update, or prune this object - it only documents the shape of the secret
# the Deployment expects. Create the real one out-of-band before the first
# sync:
#   kubectl create namespace thekeeper
#   kubectl create secret generic thekeeper-secrets \
#     --namespace thekeeper \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-...
#
# If you'd rather manage this via GitOps, swap it for a SealedSecret or an
# External Secrets Operator resource instead (and drop the skip annotation).
apiVersion: v1
kind: Secret
metadata:
  name: thekeeper-secrets
  namespace: thekeeper
  annotations:
    argocd.argoproj.io/sync-options: Skip=true
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_ME"
