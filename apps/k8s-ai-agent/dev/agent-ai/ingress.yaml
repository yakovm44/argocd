
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: k8s-agent
  namespace: k8s-ai-agent
spec:
  ingressClassName: nginx
  rules: k8s-agent.com
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: k8s-agent  # Replace with your Kubernetes Service name
            port:
              number: 8000
